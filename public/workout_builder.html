<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="home.html" class="logo">Workout <span>Tracker</span></a>
    <nav>
      <a href="home.html">Home</a>
      <a href="workout_builder.html">Build</a>
      <a href="#">Log</a>
      <a href="#">History</a>
      <a href="#">Community</a>
    </nav>
  </header>

  <main>

    <h1 class="pageTitle">Workout Builder</h1>

    <p id="message" class="message"></p>

    <div class="builder">

      <!-- Left side: catalog -->
      <section class="builderBox">
        <h2>Exercise Catalog</h2>

        <div class="filters">
          <input type="text" id="searchBox" placeholder="Search exercises...">
          <select id="muscleFilter">
            <option value="All">All muscles</option>
            <option value="Chest">Chest</option>
            <option value="Back">Back</option>
            <option value="Shoulders">Shoulders</option>
            <option value="Biceps">Biceps</option>
            <option value="Triceps">Triceps</option>
            <option value="Legs">Legs</option>
            <option value="Core">Core</option>
          </select>
        </div>

        <div id="catalogList"></div>

        <h2 class="customTitle">Add Custom Exercise</h2>

        <div class="customForm">
          <input type="text" id="customName" placeholder="Exercise name">
          <input type="text" id="customMachine" placeholder="Machine type (ex: Cable, Barbell)">
          <input type="text" id="customGrip" placeholder="Attachment / grip (ex: Rope, Wide grip)">
          <select id="customMuscle">
            <option value="Chest">Chest</option>
            <option value="Back">Back</option>
            <option value="Shoulders">Shoulders</option>
            <option value="Biceps">Biceps</option>
            <option value="Triceps">Triceps</option>
            <option value="Legs">Legs</option>
            <option value="Core">Core</option>
          </select>
          <button id="customBtn" class="button">Add to catalog</button>
        </div>
      </section>

      <!-- Right side: the workout being built -->
      <section class="builderBox">
        <h2>Your Workout</h2>

        <input type="text" id="workoutName" placeholder="Workout name (ex: Push Day)">

        <div id="routineList"></div>

        <button id="saveBtn" class="button">Save workout</button>
      </section>

    </div>

  </main>

  <script src="workout_builder.js"></script>

</body>
</html>
